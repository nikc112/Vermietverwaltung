# Beispiel fuer den vorgelagerten Reverse Proxy. Diese Datei wird nirgends
# automatisch ausgerollt -- sie dokumentiert, welche Einstellungen die Anwendung
# vom Proxy erwartet, gleich ob dort nginx, Caddy, Traefik oder ein Nginx Proxy
# Manager steht.
#
# Diese Schicht steht zum Internet hin. Sie ist die einzige Stelle, an der sich
# entscheiden laesst, welche Forwarded-Header echt sind -- der Container dahinter
# kann das nicht mehr pruefen. Siehe SECURITY.md, Restbefund 1.

server {
    listen 80;
    server_name mietverwaltung.example.com;
    # Ohne TLS gehoert die Anwendung nicht ins Netz: sie verwaltet
    # Ausweiskopien und Bonitaetsauskuenfte von Mietern. Diese Zeilen sind
    # Platzhalter fuer die Zertifikate, die z.B. certbot ablegt.
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/mietverwaltung.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mietverwaltung.example.com/privkey.pem;

    server_tokens off;

    # HSTS gehoert hierher, nicht in den Container: nur diese Schicht weiss
    # sicher, dass die Verbindung ueber HTTPS lief. Erst einschalten, wenn TLS
    # steht und laeuft -- der Browser merkt sich das Versprechen zwei Jahre und
    # laesst bis dahin keinen Klartextzugriff mehr zu.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # 25 MB Dokumenten-Upload plus Multipart-Overhead; muss mindestens so gross
    # sein wie client_max_body_size im Frontend-Container, sonst bricht der
    # Proxy den Upload mit einer HTML-413-Seite ab.
    client_max_body_size 26M;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Alle Forwarded-Header werden hier NEU gesetzt, nicht ergaenzt. Was ein
        # Client mitgeschickt hat, wird dadurch verworfen.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Bewusst $remote_addr statt $proxy_add_x_forwarded_for: haengte diese
        # Schicht den vom Client mitgeschickten Wert an, koennte er ihn frei
        # waehlen und damit die Ratenbegrenzung bei jedem Versuch zuruecksetzen.
        # Nur was hier eingetragen wird, ist echt.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # Bewusst KEIN Upgrade/Connection-Header: die Anwendung verwendet keine
        # WebSockets. Stuenden sie hier, reichte der Proxy jeden vom Client
        # behaupteten Upgrade-Wunsch ungeprueft an die Anwendung weiter.
        proxy_set_header   Connection        "";
    }
}
