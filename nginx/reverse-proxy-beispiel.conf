# Beispiel fuer den vorgelagerten Reverse Proxy. Diese Datei wird nirgends
# automatisch ausgerollt -- sie dokumentiert, welche Einstellungen die Anwendung
# vom Proxy erwartet, gleich ob dort nginx, Caddy, Traefik oder ein Nginx Proxy
# Manager steht.
#
# Die Anwendung verlaesst sich nicht blind auf X-Forwarded-For: Sie glaubt den
# Kopf nur, wenn er von einer Adresse aus TRUST_PROXY stammt (siehe
# backend/src/config.ts und .env.example). Laeuft der Proxy auf einer anderen
# Maschine, gehoert dessen Adresse dort eingetragen.

server {
    listen 80;
    server_name mietverwaltung.example.com;

    # 25 MB Dokumenten-Upload plus Multipart-Overhead; muss mindestens so gross
    # sein wie client_max_body_size im Frontend-Container, sonst bricht der
    # Proxy den Upload mit einer HTML-413-Seite ab.
    client_max_body_size 26M;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Bewusst $remote_addr statt $proxy_add_x_forwarded_for: Diese Schicht steht
        # zum Internet hin. Wuerde sie den vom Client mitgeschickten Wert anhaengen,
        # koennte er ihn frei waehlen und damit die Ratenbegrenzung der Anmeldung
        # bei jedem Versuch zuruecksetzen. Nur was hier eingetragen wird, ist echt.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
