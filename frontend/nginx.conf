# Nur "https" und "http" werden uebernommen, alles andere faellt auf das
# tatsaechliche Schema dieser Verbindung zurueck. Ohne diese Normalisierung
# reichte der Container weiter, was immer ein Client in den Header schreibt.
map $http_x_forwarded_proto $weitergereichtes_schema {
    default  $scheme;
    "https"  "https";
    "http"   "http";
}

# HSTS gehoert an den aeusseren HTTPS-Proxy. Hier wird er nur gesetzt, wenn die
# Anfrage nachweislich ueber HTTPS hereinkam -- ein Versprechen ueber Klartext
# waere falsch und sperrt beim Testen die Domain fuer Monate aus.
map $weitergereichtes_schema $hsts {
    default  "";
    "https"  "max-age=63072000; includeSubDomains";
}

# Hinweis zu den Zwischenverzeichnissen: nginx-unprivileged legt seine
# temp_path-Direktiven bereits in der eigenen nginx.conf auf /tmp. Sie hier zu
# wiederholen bricht den Start mit "directive is duplicate" -- deshalb stehen
# sie bewusst NICHT in dieser Datei. Aus demselben Grund braucht /var/cache/nginx
# kein tmpfs: dort wird nichts geschrieben, solange kein proxy_cache eingerichtet ist.

server {
    # 8080 statt 80: nur fuer Ports unter 1024 braucht ein Prozess Wurzelrechte.
    # Der Verzicht darauf ist die Voraussetzung dafuer, dass dieser Container als
    # Benutzer 101 laeuft und ihm alle Capabilities entzogen werden koennen.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Verschweigt die nginx-Version in Fehlerseiten und im Server-Header. Sie
    # nennt einem Angreifer sonst genau, welche Luecken einen Versuch lohnen.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location /api/ {
        # Dokumenten-Upload: 25 MB Nutzdaten plus Multipart-Overhead. Ohne diese
        # Zeile greift der nginx-Standard von 1 MB, und jeder Vertragsscan
        # scheitert mit einer HTML-413-Seite, bevor das Backend ihn ueberhaupt sieht.
        client_max_body_size 26m;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        # Bewusst KEIN "proxy_set_header Upgrade $http_upgrade" und kein
        # "Connection: upgrade": die Anwendung verwendet keine WebSockets.
        # Standen sie hier, reichte der Proxy jeden vom Client behaupteten
        # Upgrade-Wunsch ungeprueft an das Backend weiter.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $weitergereichtes_schema;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # frame-ancestors 'none' ersetzt X-Frame-Options wirksam; letzteres bleibt
    # fuer aeltere Browser stehen.
    # script-src bewusst OHNE 'unsafe-inline' und OHNE 'unsafe-eval' -- das
    # gebaute index.html laedt ausschliesslich externe Module.
    # style-src braucht 'unsafe-inline': die Oberflaechenbausteine (Radix,
    # Recharts) setzen Positionen und Groessen als style-Attribut. Das ist die
    # deutlich harmlosere der beiden Freigaben und laesst sich ohne Austausch
    # der Bibliotheken nicht vermeiden.
    # blob: bei img und frame deckt die heruntergeladenen PDF-Abrechnungen ab,
    # die der Browser aus einem Object-URL oeffnet.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $hsts always;
    # Die Anwendung braucht weder Kamera noch Mikrofon noch Standort.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
}
